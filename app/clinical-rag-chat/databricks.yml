bundle:
  name: clinical-rag-chat

variables:
  files_path:
    description: Volume path for file storage
  files_id:
    description: UC volume full name
  serving_endpoint_name:
    description: Serving endpoint name
  ingest_job_id:
    description: Ingest job id for re-index from the app

resources:
  apps:
    app:
      name: "clinical-rag-chat"
      description: "LangChain RAG chatbot for C-CDA, PDF, HL7 v2, and FHIR JSON"
      source_code_path: ./
      user_api_scopes:
        - files.files
        - serving.serving-endpoints
        - vectorsearch.vector-search-endpoints
      resources:
        - name: files
          uc_securable:
            securable_full_name: ${var.files_id}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: ingest-job
          job:
            id: ${var.ingest_job_id}
            permission: CAN_MANAGE_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-7c3eed4c-66bb.cloud.databricks.com
      profile: dbc-7c3eed4c
    variables:
      files_path: /Volumes/workspace/ccda_rag/docs
      files_id: workspace.ccda_rag.docs
      serving_endpoint_name: databricks-meta-llama-3-3-70b-instruct
      ingest_job_id: "1026899989768735"
